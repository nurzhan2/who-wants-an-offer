# Employers whose public ATS boards the ats/ connectors walk, one list per vendor.
#
# Each entry:
#   slug:     the vendor's board token (boards.greenhouse.io/<slug>,
#             jobs.lever.co/<slug>, jobs.ashbyhq.com/<slug>,
#             apply.workable.com/<slug>, jobs.smartrecruiters.com/<slug>,
#             <slug>.recruitee.com)
#   company:  display name, stored as the posting's company
#   region:   kz | cis | world — a label for the owner, not a filter
#   remote:   whether the employer is known to hire remotely at all
#   note:     why it is here, and how sure the guess is
#   verified: false until one live request confirmed the board
#
# HONESTY NOTE. This list was seeded from memory in a container whose network
# was closed (every outbound request got a proxy 403), so NOT ONE entry has
# been checked: a company may have moved to another vendor, renamed its board
# token, or closed its board. Run
#
#     uv run python scripts/verify_ats_boards.py
#
# once from a machine with network access. It asks each board once, politely,
# and prints ok / 404 / count. Set `verified: true` on the boards that answer
# with jobs, fix or delete the rest. A board that answers 404 during a normal
# run is logged and skipped, so an unverified entry costs one request, not a
# failed run.
#
# Kazakhstan employers are thin here on purpose: most of them hire through hh,
# which has its own connector, rather than through these vendors.

greenhouse:
  - slug: gitlab
    company: GitLab
    region: world
    remote: true
    note: all-remote company, hires in many countries
    verified: false
