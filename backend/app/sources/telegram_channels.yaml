# Public Telegram channels the `telegram` source reads, by @username, without
# joining them. Phase 22.
#
# HONESTY NOTE: this starter list was written from memory in a container with
# no route to Telegram, so not one entry has been checked. Every entry is
# `verified: false`. The first run checks each one: a username that resolves to
# nothing is logged as `sources.telegram.channel_missing`, and a channel whose
# newest post is older than 30 days as `sources.telegram.channel_dead`. Then
#   uv run python scripts/prune_telegram_channels.py          # dry run, prints
#   uv run python scripts/prune_telegram_channels.py --apply  # rewrites this file
# removes them, printing each one it removes — never silently.
#
# Fields: username (without @), region (kz | ru | cis | world), language
# (ru | en | kk), kind (jobs | freelance | relocation), stack (free list).
channels:
  # ── Kazakhstan ──────────────────────────────────────────────────────
  - {username: itjobs_kz, region: kz, language: ru, kind: jobs, stack: [it], verified: false}
  - {username: kz_it_jobs, region: kz, language: ru, kind: jobs, stack: [it], verified: false}
